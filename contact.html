<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contact | Digitl Cats</title>
<script src="assets/config.js"></script>
<script src="assets/head.js" data-page-type="contact"></script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page-type="contact">
<main class="wrap">
<h1>Contact us</h1>
<form id="contact-form" style="max-width:520px">
  <label class="field">Topic <select name="topic"><option value="order">Order question</option><option value="product">Product question</option><option value="other">Something else</option></select></label>
  <label class="field">Your name (made up please) <input name="name" placeholder="Test Cat" autocomplete="off"></label>
  <label class="field">Message <textarea name="message" rows="4" placeholder="Meow?"></textarea></label>
  <button>Send</button>
</form>
<p id="contact-done" class="note" hidden>Thanks! This is a test form: nothing was sent or stored.</p>
</main>
<script src="assets/catalog.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
